<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fred &amp; Sydney – Coming Soon</title>
<meta name="description" content="Fred &amp; Sydney are getting married on October 8, 2027 at Bellamere Winery in London, Ontario. Our website is coming soon.">
<meta name="theme-color" content="#7E9668">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --sage: #7E9668;
    --sage-dark: #4F6340;
    --sage-light: #EEF1EA;
    --ink: #2F3A27;
    --ink-soft: #4A5A3E;
    --paper: #FBFAF6;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    background: var(--sage);
    background-image:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.18), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(0,0,0,.14), transparent 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-text-size-adjust: 100%;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--paper);
    text-align: center;
    padding: 56px 36px 48px;
    border-radius: 4px;
    box-shadow: 0 18px 40px rgba(0,0,0,.25);
    position: relative;
  }
  /* pin */
  main::before {
    content: "";
    position: absolute;
    top: 16px; left: 50%;
    width: 14px; height: 14px;
    margin-left: -7px;
    border-radius: 50%;
    background: #C9A24B;
    box-shadow: 0 2px 3px rgba(0,0,0,.45), inset -2px -2px 3px rgba(0,0,0,.25), inset 2px 2px 3px rgba(255,255,255,.55);
  }
  .eyebrow {
    margin: 0 0 18px;
    font-size: .8rem;
    letter-spacing: .35em;
    text-transform: uppercase;
    color: var(--sage-dark);
  }
  h1 {
    margin: 0;
    font-weight: normal;
    font-size: clamp(2.6rem, 11vw, 3.8rem);
    line-height: 1.1;
  }
  h1 span { color: var(--sage); }
  .rule {
    width: 80px; height: 2px;
    background: var(--sage);
    margin: 28px auto;
    border: 0;
  }
  .lead {
    margin: 0 0 6px;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--ink-soft);
  }
  .date {
    margin: 18px 0 6px;
    font-size: clamp(1.4rem, 6vw, 1.9rem);
    letter-spacing: .04em;
  }
  .venue {
    margin: 0;
    font-size: .85rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--sage-dark);
  }
  .btn {
    display: inline-block;
    margin-top: 36px;
    padding: 16px 40px;
    background: var(--sage-dark);
    color: #fff;
    text-decoration: none;
    font-size: .85rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    border-radius: 3px;
    transition: background .2s ease, transform .2s ease;
  }
  .btn:hover { background: var(--ink); transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid var(--sage); outline-offset: 3px; }
  .note {
    margin: 32px 0 0;
    font-size: .9rem;
    color: var(--ink-soft);
  }
  @media (max-width: 480px) {
    main { padding: 52px 22px 40px; }
    .btn { display: block; padding: 18px 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Coming Soon</p>
    <h1>Fred <span>&amp;</span> Sydney</h1>
    <hr class="rule">
    <p class="lead">We're getting married!</p>
    <p class="date">Friday, October 8, 2027</p>
    <p class="venue">Bellamere Winery &bull; London, Ontario</p>

    <a class="btn" href="save_the_date.html">Save the Date</a>

    <p class="note">Our full wedding website is on its way.</p>
  </main>
</body>
</html>
